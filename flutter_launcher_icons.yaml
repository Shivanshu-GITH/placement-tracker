flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/full.png"
  min_sdk_android: 23
  adaptive_icon_background: "assets/icon/bg.png"
  adaptive_icon_foreground: "assets/icon/fg.png"
  # Monochrome icon (Android 13+ themed icons) reuses the foreground silhouette.
  adaptive_icon_monochrome: "assets/icon/fg.png"
