# Memory-constrained machine (7.8 GB RAM): keep the Gradle JVM small so the
# build never forces heavy swapping / overheating on an old laptop. 1.5 GB heap
# is ample for R8 + dexing on an app this size.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
# One-off builds: no lingering daemon JVM holding RAM after the build ends.
org.gradle.daemon=false
# Limit parallel workers so the build doesn't spike all 8 cores / RAM at once.
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# Disable Kotlin incremental compilation: avoids flaky "Could not close
# incremental caches" failures on Windows (file-locking during cache close).
kotlin.incremental=false
# Run the Kotlin compiler in-process to sidestep daemon cache-close races.
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
