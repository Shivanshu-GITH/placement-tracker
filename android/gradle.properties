org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation: avoids flaky "Could not close
# incremental caches" failures on Windows (file-locking during cache close).
kotlin.incremental=false
# Run the Kotlin compiler in-process to sidestep daemon cache-close races.
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
